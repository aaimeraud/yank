name: Release

# Push a tag like v0.1.0 (see docs/releasing.md). Builds the unsigned macOS
# app for Apple Silicon and Intel and publishes a GitHub release whose notes
# are that version's section of the changelog.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # The scripts are stdlib only: nothing to cache.
          enable-cache: false
      - run: bun install --frozen-lockfile
      - name: Tag matches the app version
        run: |
          uv run scripts/release.py check
          test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Yank ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
