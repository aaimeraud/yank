name: Release

# Push a tag like v0.1.0 (see docs/releasing.md). Builds the ad-hoc signed macOS
# app for Apple Silicon and Intel and publishes a GitHub release whose notes
# are that version's section of the changelog.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # The scripts are stdlib only: nothing to cache.
          enable-cache: false
      - run: bun install --frozen-lockfile
      - name: Tag matches the app version
        run: |
          uv run scripts/release.py check
          test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Yank ${{ github.ref_name }}
          releaseBody: |
            ${{ needs.notes.outputs.body }}

            ## Install

            Download the `.dmg` for your Mac (`aarch64` for Apple Silicon, `x64` for Intel), drag Yank to Applications, then `brew install yt-dlp ffmpeg deno`.

            Yank is not notarized, so macOS blocks the first launch. Open it once, then go to System Settings › Privacy & Security and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/Yank.app` in Terminal.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
      # An unsealed bundle opens on the build machine but is "damaged" once
      # downloaded (v0.1.0-v0.1.2). Fail the release if the signature is not
      # valid for the whole bundle.
      - name: Bundle signature is valid
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Yank.app"
