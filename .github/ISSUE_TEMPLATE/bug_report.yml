name: Bug report
description: Report a problem in the app
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what went wrong.
      placeholder: I expected ..., but ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest steps that show the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: For example, 1.2.0
  - type: textarea
    id: extra
    attributes:
      label: Extra details
      description: Add screenshots, links, or error messages if useful.
      placeholder: Optional